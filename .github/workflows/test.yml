name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --prefix lecture-ppt-workflow
          python -m pip install -r lecture-ppt-workflow/requirements.txt
      - name: Node tests
        run: npm test --prefix lecture-ppt-workflow
      - name: Python tests
        working-directory: lecture-ppt-workflow
        run: python -m unittest discover -s tests -v
      - name: Skill structure
        run: python lecture-ppt-workflow/scripts/validate_skill.py
      - name: Demo build (no rendering)
        run: python demo/run_demo.py --out out/ci-demo --no-render
      - name: Example outline in sync with demo
        shell: bash
        run: cmp demo/outline.json lecture-ppt-workflow/examples/outline.json
      - name: Plugin mirror in sync
        run: python -B scripts/build_plugin.py --check
