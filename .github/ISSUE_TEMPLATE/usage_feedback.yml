name: "使用反馈 / Usage feedback"
description: "告诉我们是否成功做出课件 / Tell us what worked or where you got stuck."
title: "[feedback] "
body:
  - type: markdown
    attributes:
      value: "感谢试用！中文或英文均可。请勿提交学生信息、私有讲义、账号路径或密钥。Thanks for trying this workflow. Chinese and English are welcome. Share only sanitized information; this issue is public."
  - type: dropdown
    id: outcome
    attributes:
      label: "完成到哪一步？ / How far did you get?"
      options:
        - "只看了介绍或示例 / Only looked at the README or sample"
        - "用在线页面做出了课件 / Made a deck with the web page"
        - "在线页面使用遇阻 / Got stuck on the web page"
        - "作为 Skill 安装遇阻 / Skill installation blocked"
        - "用 Skill 做出了课件 / Made a deck with the Skill"
        - "已用于实际上课 / Used the deck in a real class"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "版本或提交 / Version or commit"
      placeholder: "例如 / e.g. v0.2.0 或在线页面 / or web page"
  - type: textarea
    id: environment
    attributes:
      label: "运行环境 / Environment"
      description: "使用的 AI（如 DeepSeek、ChatGPT）、浏览器、PowerPoint 或 WPS、课程语言 / AI chatbot, browser, PowerPoint or WPS, course language."
      placeholder: "Kimi; Edge; WPS 2024; 中文课程"
  - type: textarea
    id: experience
    attributes:
      label: "使用结果或卡点 / Result or blocker"
      description: "What were you trying to make? What worked? If blocked, include the exact sanitized error."
    validations:
      required: true
  - type: textarea
    id: next
    attributes:
      label: "最希望改进什么？ / What should improve next?"
  - type: checkboxes
    id: privacy
    attributes:
      label: "公开信息确认 / Public information"
      options:
        - label: "已移除私人信息与未获授权材料 / I have removed private information and material I cannot share."
          required: true
  - type: checkboxes
    id: quotation
    attributes:
      label: "可选：公开引用 / Optional quotation permission"
      description: "留空不影响反馈。Posting feedback does not otherwise grant permission to use it as a testimonial."
      options:
        - label: "允许维护者在项目介绍中匿名引用本条文字反馈 / The maintainer may anonymously quote this text feedback in project materials."
          required: false
